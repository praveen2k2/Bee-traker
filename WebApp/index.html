<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Dashboard Landing Page</title>
    <style>
        @import url(styles.css);
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
}

body, html {
    height: 100%;
    width: 100%;
    overflow: hidden;
}

.landing-page {
    position: relative;
    width: 100%;
    height: 100vh;
    background: url('./assest/3.png') no-repeat right center/cover;
    display: flex;
    align-items:center;
    justify-content:left;
    text-align:left;
    color: rgb(0, 0, 0);
    padding-inline-start: 5%;
}

.landing-page::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.content {
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 3em;
    margin-bottom: 0.5em;
}

p {
    font-size: 1.5em;
    margin-bottom: 1.5em;
}

.btn {
    padding: 0.75em 2em;
    font-size: 1.2em;
    color: white;
    background-color: #f4a261;
    border: none;
    border-radius: 5px;
    text-decoration: none;
    transition: background-color 0.3s ease;
}

.btn:hover {
    background-color: #e76f51;
}
    </style>
</head>
<body>
    <div class="landing-page">
        <div class="content">
            <h1>Welcome to Hive Link</h1>
            <p>Open your hives only for the right reasons.</p>
            <a href="./src/auth/" class="btn">Get Started</a>
        </div>
    </div>
</body>
</html>
